name: release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-release:
    name: Semantic release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        run: >-
          npm install -g
          semantic-release
          @semantic-release/commit-analyzer
          @semantic-release/exec
          @semantic-release/git
          @semantic-release/github
          @semantic-release/release-notes-generator
          @semantic-release/changelog

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npx semantic-release --ci 2>&1 | tee "$RUNNER_TEMP/release.log"

      - name: Write release summary
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/release.log" ]; then
            {
              echo "### Release failed"
              echo ""
              echo "Check the job log for details."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          esc=$(printf '\033')
          clean=$(sed "s/${esc}\[[0-9;]*m//g" "$RUNNER_TEMP/release.log")
          version=$(echo "$clean" | grep -oP "Published release \K\S+" || true)

          if [ -n "$version" ]; then
            {
              echo "### Released ${version}"
              echo ""
              echo "GitHub release created successfully."
            } >> "$GITHUB_STEP_SUMMARY"
          elif echo "$clean" | grep -qi "no relevant changes"; then
            {
              echo "### No release"
              echo ""
              echo "No relevant changes were detected since the last release."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Release failed"
              echo ""
              echo "Check the job log for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
